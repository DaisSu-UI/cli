# GitLab 10.5 / Runner 11.11：仅使用 only/except，不使用 rules/needs/resource_group。
image: node:24-bookworm
variables:
  GIT_DEPTH: "50"
  DAISU_UI_AUTO_SYNC: "0"
  NODE_OPTIONS: "--max-old-space-size=2048"
stages:
  - verify
  - publish
cache:
  key: daisu-ui-cli-npm
  paths:
    - .npm/
before_script:
  - unset NPM_TOKEN NODE_AUTH_TOKEN
  - export npm_config_cache="$CI_PROJECT_DIR/.npm"
  - node scripts/check-release-source.mjs
  - npm ci --prefer-offline --no-audit --no-fund
verify:
  stage: verify
  script:
    - npm run verify
    - if [ -n "${DAISU_UI_SOURCE:-}" ]; then npm run sync -- --ui-dir "$DAISU_UI_SOURCE" --check; fi
    - if [ -n "${DAISU_UI_SOURCE:-}" ]; then node dist/index.js docs export --ui-dir "$DAISU_UI_SOURCE" --check; fi
    - node scripts/prepare-npm-release.mjs
  only:
    - branches
    - /^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$/
  artifacts:
    expire_in: 1 week
    paths:
      - artifacts/*.tgz
      - artifacts/npm-release.json
publish:npm:
  stage: publish
  before_script: []
  dependencies:
    - verify
  script:
    - node scripts/publish-npm-release.mjs
  only:
    - /^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$/
